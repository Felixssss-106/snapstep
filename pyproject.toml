[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snapstep"
version = "0.2.1"
description = "录屏自动生成图文教程 / Record your screen, get a step-by-step guide with screenshots — automatically."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Felixssss-106" }]
keywords = [
    "screenshot",
    "documentation",
    "scribe",
    "sop",
    "tutorial",
    "screen-recording",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Documentation",
]
dependencies = [
    "pynput>=1.7",
    "mss>=9.0",
    "pillow>=10.0",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "PySide6>=6.6",
    "uiautomation>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.0", "ruff>=0.6"]

[project.scripts]
snapstep = "snapstep.cli:main"

[project.urls]
Homepage = "https://github.com/Felixssss-106/snapstep"
Issues = "https://github.com/Felixssss-106/snapstep/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snapstep = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
